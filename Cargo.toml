[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# Build space: debug info for ~400 dependencies (Tauri, WebKit bindings) made target/
# 9 GB. Nobody steps through this code in a debugger, so no debug info anywhere, and
# bin/test runs the Rust tests in release so tests and builds share one compiled tree.
[profile.dev]
debug = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
