<!doctype html>
<!-- The tab that follows the pointer while a tab is dragged between leaf windows. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        cursor: default;
        user-select: none;
        background: #fff;
        color: #1f2328;
      }
      body {
        display: flex;
        align-items: center;
        padding: 0 12px;
        box-sizing: border-box;
        box-shadow:
          inset 0 2px 0 #0a6cff,
          inset 0 0 0 1px #d0d5db;
        font:
          11.5px ui-monospace,
          Menlo,
          monospace;
        white-space: nowrap;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1d1d1f;
          color: #e6e6e6;
        }
        body {
          box-shadow:
            inset 0 2px 0 #4c8dff,
            inset 0 0 0 1px #3a3a3c;
        }
      }
      #t {
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <span id="t"></span>
  </body>
</html>
