name: release

# Push a tag that matches the version in Cargo.toml (v0.2.0 for 0.2.0) to build the
# macOS app and publish it as a GitHub release. Run it by hand (Actions > release >
# Run workflow) for a dry run: the packages are attached to the run, nothing is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      # Secrets can't be read in a step's `if`; this can.
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_TAP: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version
        if: github.event_name == 'push'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Signing is optional: with a Developer ID certificate in the secrets the app is
      # signed and notarized; without one it is signed ad hoc.
      - name: Signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Package
        env:
          LEAF_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bin/package
      - name: Dry run packages
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: leaf-macos
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/*.sha256
      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "leaf $GITHUB_REF_NAME" --generate-notes \
            dist/release/*.dmg dist/release/*.zip dist/release/*.sha256
      # The cask in robhurring/homebrew-taps follows each release (brew install --cask
      # robhurring/taps/leaf), when a token that can push there is in the secrets.
      - name: Homebrew cask
        if: github.event_name == 'push' && env.HAS_TAP == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha="$(awk '/\.zip$/ { print $1 }' dist/release/*.sha256)"
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/robhurring/homebrew-taps.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -e "s/^  version \".*\"/  version \"$version\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/leaf.rb
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -qam "leaf $version"
          git push -q
