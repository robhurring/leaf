[package]
name = "leaf-app"
description = "leaf reader: the `leaf` command and app (serve mode and, later, the window)"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "leaf"
path = "src/main.rs"

[dependencies]
leaf-core = { path = "../leaf-core" }
leaf-protocol = { path = "../leaf-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["json", "fmt"] }
axum = { version = "0.8", features = ["ws", "macros"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
rust-embed = "8"
base64 = "0.23"
mime_guess = "2"
chrono = "0.4"
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"
libc = "0.2"
open = "5"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
leaf-core = { path = "../leaf-core", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
