[package]
name = "leaf-core"
description = "leaf's core: config, disk source, watcher, git, preferences, and the transport-free engine"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
leaf-protocol = { path = "../leaf-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
dotenvy = "0.15"
mime_guess = "2"
ignore = "0.4"
async-trait = "0.1"
base64 = "0.23"
notify = "8"

[features]
# In-memory fakes for tests of this crate and of crates built on it.
testing = []

[dev-dependencies]
tempfile = "3"
leaf-core = { path = ".", features = ["testing"] }
